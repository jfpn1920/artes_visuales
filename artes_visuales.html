<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>artes visuales</title>
    <link rel="stylesheet" href="artes_visuales.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">
    <script src="artes_visuales.js" defer></script>
</head>
<body>
    <!----------------------------------->
    <!--|estructuracion_artes_visuales|-->
    <!----------------------------------->
    <main class="app">
        <!-- ENCABEZADO: título, descripción y valoración promedio -->
        <header class="encabezado">
            <h1>Artes Visuales</h1>
            <p>Tres obras abstractas. Valóralas y deja tu comentario.</p>
            <!-- JavaScript escribe aquí el promedio de las valoraciones -->
            <p id="resumen" class="resumen"></p>
        </header>
        <!-- GALERÍA: contiene las tres obras -->
        <section class="galeria">
            <!-- OBRA 1: el atributo data-id identifica cada obra al guardar -->
            <article class="tarjeta" data-id="atardecer">
                <!-- Cada obra es un dibujo SVG hecho con formas simples -->
                <svg class="lienzo" viewBox="0 0 200 150" role="img" aria-label="Atardecer geométrico">
                    <rect width="200" height="150" fill="#f2b134"/>
                    <circle cx="100" cy="85" r="40" fill="#e4572e"/>
                    <polygon points="0,150 60,70 120,150" fill="#2e4057"/>
                    <polygon points="80,150 150,60 200,150" fill="#1f2d3d"/>
                </svg>
                <div class="contenido">
                    <h2>Atardecer geométrico</h2>
                    <p class="detalle">Formas planas · 2024</p>
                    <div class="estrellas" aria-label="Valoración"></div>
                    <textarea rows="2" placeholder="Escribe un comentario..." aria-label="Comentario"></textarea>
                    <button class="btn-ampliar" data-ampliar type="button">Ver en grande</button>
                </div>
            </article>
            <!-- OBRA 2 -->
            <article class="tarjeta" data-id="olas">
                <svg class="lienzo" viewBox="0 0 200 150" role="img" aria-label="Olas en azul">
                    <rect width="200" height="150" fill="#0b3954"/>
                    <path d="M0 60 Q50 30 100 60 T200 60 V150 H0Z" fill="#087e8b"/>
                    <path d="M0 90 Q50 60 100 90 T200 90 V150 H0Z" fill="#5bc0be"/>
                    <path d="M0 120 Q50 90 100 120 T200 120 V150 H0Z" fill="#c5f4f2"/>
                </svg>
                <div class="contenido">
                    <h2>Olas en azul</h2>
                    <p class="detalle">Curvas superpuestas · 2023</p>
                    <div class="estrellas" aria-label="Valoración"></div>
                    <textarea rows="2" placeholder="Escribe un comentario..." aria-label="Comentario"></textarea>
                    <button class="btn-ampliar" data-ampliar type="button">Ver en grande</button>
                </div>
            </article>
            <!-- OBRA 3 -->
            <article class="tarjeta" data-id="constelacion">
                <svg class="lienzo" viewBox="0 0 200 150" role="img" aria-label="Constelación">
                    <rect width="200" height="150" fill="#2b2d42"/>
                    <polyline points="30,110 70,50 120,80 170,30" fill="none" stroke="#edf2f4" stroke-width="2"/>
                    <circle cx="30" cy="110" r="7" fill="#ef233c"/>
                    <circle cx="70" cy="50" r="9" fill="#edf2f4"/>
                    <circle cx="120" cy="80" r="6" fill="#8d99ae"/>
                    <circle cx="170" cy="30" r="8" fill="#ef233c"/>
                </svg>
                <div class="contenido">
                    <h2>Constelación</h2>
                    <p class="detalle">Puntos y líneas · 2025</p>
                    <div class="estrellas" aria-label="Valoración"></div>
                    <textarea rows="2" placeholder="Escribe un comentario..." aria-label="Comentario"></textarea>
                    <button class="btn-ampliar" data-ampliar type="button">Ver en grande</button>
                </div>
            </article>
        </section>
    </main>
    <!-- VISOR: ventana emergente para ver una obra en grande -->
    <dialog id="visor" class="visor">
        <h2 id="visorTitulo"></h2>
        <div id="visorObra"></div>
        <button id="btnCerrar" class="btn-cerrar" type="button">Cerrar</button>
    </dialog>
</body>
</html>
